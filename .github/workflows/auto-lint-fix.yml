name: Auto Lint Fix

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  auto-fix-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Auto Lint Fixer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python scripts/auto_lint_fixer.py

      - name: Commit and Push Fixes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated linting fixes by Gemini"
          branch: ${{ github.ref }}
